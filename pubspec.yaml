name: sentin8
description: Sentin8 Flutter SDK - unified infrastructure for all Sentin8 Flutter apps (web + native).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web: ^1.1.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true